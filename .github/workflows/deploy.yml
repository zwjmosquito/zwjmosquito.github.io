name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Strava Sync"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --root-dir ${{ github.workspace }}/dist ./dist
          fail: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm install -g @lhci/cli@0.14.x
      - run: lhci autorun

  deploy:
    needs: [build, lighthouse]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
